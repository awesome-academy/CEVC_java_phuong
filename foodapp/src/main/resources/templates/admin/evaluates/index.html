<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Index Evaluate Page</title>
  <th:block th:replace="~{admin/layouts/static :: css_links}"></th:block>
</head>

<body class="layout-fixed sidebar-expand-lg sidebar-open bg-body-tertiary">
  <!--begin::App Wrapper-->
  <div class="app-wrapper">
    <!--begin::Header-->
    <th:block th:replace="~{admin/layouts/header :: header}"></th:block>
    <!--end::Header-->
    <!--begin::Sidebar-->
    <th:block th:replace="~{admin/layouts/sidebar :: sidebar}"></th:block>
    <!--end::Sidebar-->
    <!--begin::App Main-->
    <main class="app-main">
      <!--begin::App Content Header-->
      <div class="app-content-header">
        <!--begin::Container-->
        <div class="container-fluid">
          <!--begin::Row-->
          <div class="row">
            <div class="col-sm-6">
              <h3 class="mb-0">Index</h3>
            </div>
          </div>
          <!--end::Row-->
        </div>
        <!--end::Container-->
      </div>
      <!--end::App Content Header-->
      <!--begin::App Content-->
      <div class="app-content">
        <!--begin::Container-->
        <div class="container-fluid">
          <!--begin::Row-->
          <div class="row">
            <!-- /.col -->
            <div class="col-md-12">
              <!-- /.card -->
              <div class="card">
                <div class="card-header">
                  <div class="row">
                    <div class="col-12">
                      <form th:action="@{/admin/evaluates}" th:object="${search}" method="get">
                        <div class="d-flex gap-4 align-items-center">
                          <div class="filter-box d-flex gap-2 align-items-center">
                            <div>Filter by:</div>
                            <div>
                              <select class="form-select" th:field="*{productId}">
                                <option value="">--Product--</option>
                                <option th:each="product : ${products}" th:value="${product.id}"
                                  th:text="${product.name}"></option>
                              </select>
                            </div>
                            <div>
                              <select class="form-select" th:field="*{ratingLevel}">
                                <option value="">--Rating Level--</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                              </select>
                            </div>
                            <div>
                              <select class="form-select" th:field="*{isShow}">
                                <option value="">--All statuses--</option>
                                <option value="true">Shown</option>
                                <option value="false">Hidden</option>
                              </select>
                            </div>
                          </div>
                          <button class="btn btn-secondary" type="submit">Search</button>
                        </div>
                      </form>
                    </div>
                  </div>
                </div>
                <!-- /.card-header -->
                <div class="card-body p-0">
                  <table class="table table-striped">
                    <thead>
                      <tr>
                        <th style="width: 100px">Id</th>
                        <th>Image</th>
                        <th>Product name</th>
                        <th>Full name</th>
                        <th>Content</th>
                        <th style="width: 150px">Rating</th>
                        <th style="width: 100px">Status</th>
                        <th style="width: 180px">Created At</th>
                        <th style="width: 100px" class="text-center">Action</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr class="align-middle" th:each="evaluate, iterStat : ${evaluates}">
                        <td th:text="${evaluate.id}"></td>
                        <td>
                          <img th:if="${evaluate.image}" th:src="@{${evaluate.image}}" class="img-thumbnail">
                        </td>
                        <td th:text="${evaluate.product?.name}"></td>
                        <td th:text="${evaluate.user?.fullName}"></td>
                        <td th:text="${#strings.abbreviate(evaluate.content, 80)}" th:title="${evaluate.content}"></td>
                        <td>
                          <th:block th:replace="~{admin/layouts/rating :: stars(${evaluate.rating})}"></th:block>
                        </td>
                        <td>
                          <span th:replace="~{admin/evaluates/status_badge :: badge(${evaluate.isShow})}"></span>
                        </td>
                        <td th:text="${#temporals.format(evaluate.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                        <td class="text-center">
                          <form th:replace="~{admin/evaluates/toggle_display_form :: form(${evaluate})}"></form>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
                <!-- /.card-body -->
                <div class="card-footer">
                  <div class="row">
                    <div class="col-sm-6">
                      <form th:action="@{/admin/evaluates}" th:object="${search}" method="get" id="perPageForm">
                        <input type="hidden" name="productId" th:value="${search.productId}" />
                        <input type="hidden" name="ratingLevel" th:value="${search.ratingLevel}" />
                        <input type="hidden" name="isShow" th:value="${search.isShow}" />
                        <div class="per-page-box d-flex gap-2 align-items-center">
                          <div>Per page:</div>
                          <div>
                            <select class="form-select form-select-sm" name="perPage"
                              onchange="document.getElementById('perPageForm').submit()">
                              <option value="5" th:selected="${evaluates.size} == 5">5</option>
                              <option value="10" th:selected="${evaluates.size} == 10">10</option>
                              <option value="15" th:selected="${evaluates.size} == 15">15</option>
                            </select>
                          </div>
                        </div>
                      </form>
                    </div>
                    <div class="col-sm-6">
                      <ul class="pagination pagination-sm float-end" th:if="${totalPages > 1}" th:with="currentPage=${evaluates.number + 1}, perPage=${evaluates.size}">
                        <li class="page-item" th:classappend="${currentPage} == ${1} ? 'disabled'">
                          <a class="page-link"
                            th:href="@{/admin/evaluates(page=${currentPage - 1}, perPage=${perPage}, productId=${search.productId}, ratingLevel=${search.ratingLevel}, isShow=${search.isShow})}">&laquo;</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages-1)}"
                          th:classappend="${i + 1} == ${currentPage} ? 'active'">
                          <a class="page-link"
                            th:href="@{/admin/evaluates(page=${i + 1}, perPage=${perPage}, productId=${search.productId}, ratingLevel=${search.ratingLevel}, isShow=${search.isShow})}"
                            th:text="${i + 1}">
                          </a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage} == ${totalPages} ? 'disabled'">
                          <a class="page-link"
                            th:href="@{/admin/evaluates(page=${currentPage + 1}, perPage=${perPage}, productId=${search.productId}, ratingLevel=${search.ratingLevel}, isShow=${search.isShow})}">
                            &raquo;
                          </a>
                        </li>
                      </ul>
                    </div>
                  </div>
                </div>
              </div>
              <!-- /.card -->
            </div>
            <!-- /.col -->
          </div>
          <!--end::Row-->
        </div>
        <!--end::Container-->
      </div>
      <!--end::App Content-->
    </main>
    <!--end::App Main-->
    <!--begin::Footer-->
    <th:block th:replace="~{admin/layouts/footer :: footer}"></th:block>
    <!--end::Footer-->
  </div>
  <!--end::App Wrapper-->
  <!--begin::Script-->
  <!--begin::Third Party Plugin(OverlayScrollbars)-->
  <th:block th:replace="~{admin/layouts/static :: js_scripts}"></th:block>
  <!--end::OverlayScrollbars Configure-->
  <!-- OPTIONAL SCRIPTS -->
  <!-- sortablejs -->
  <!--end::Script-->
</body>

</html>
