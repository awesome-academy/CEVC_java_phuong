<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Detail suggestion</title>
  <th:block th:replace="~{admin/layouts/static :: css_links}"></th:block>
</head>

<body class="layout-fixed sidebar-expand-lg sidebar-open bg-body-tertiary">
  <!--begin::App Wrapper-->
  <div class="app-wrapper">
    <!--begin::Header-->
    <th:block th:replace="~{admin/layouts/header :: header}"></th:block>
    <!--end::Header-->
    <!--begin::Sidebar-->
    <th:block th:replace="~{admin/layouts/sidebar :: sidebar}"></th:block>
    <!--end::Sidebar-->
    <!--begin::App Main-->
    <main class="app-main">
      <!--begin::App Content Header-->
      <div class="app-content-header">
        <div class="container-fluid">
          <div class="row">
            <div class="col-sm-6">
              <h3 class="mb-0">Detail suggestion</h3>
            </div>
          </div>
        </div>
      </div>
      <!--end::App Content Header-->
      <div class="app-content">
        <div class="container-fluid">
          <div class="row g-4">
            <div class="col-md-9">
              <div class="card card-primary card-outline mb-4">
                <div class="card-body">
                  <div class="mb-3">
                    <label class="form-label fw-bold">ID: </label>
                    <p th:text="${suggestion.id}"></p>
                  </div>
                  <div class="mb-3">
                    <label class="form-label fw-bold">User: </label>
                    <p th:text="${suggestion.user?.fullName}"></p>
                  </div>
                  <div class="mb-3">
                    <label class="form-label fw-bold">Title: </label>
                    <p th:text="${suggestion.title}"></p>
                  </div>
                  <div class="mb-3">
                    <label class="form-label fw-bold">Description: </label>
                    <p th:text="${suggestion.description}" style="white-space: pre-line;"></p>
                  </div>
                  <div class="mb-3">
                    <label class="form-label fw-bold">Image: </label>
                    <div>
                      <img th:if="${suggestion.image}" th:src="@{${suggestion.image}}" class="image-medium">
                      <p th:unless="${suggestion.image}">N/A</p>
                    </div>
                  </div>
                  <div class="mb-3">
                    <label class="form-label fw-bold">Status: </label>
                    <p><span th:replace="~{admin/suggestions/status_badge :: badge(${suggestion.status})}"></span></p>
                  </div>
                  <div class="mb-3" th:if="${suggestion.reasonReject}">
                    <label class="form-label fw-bold">Reason Reject: </label>
                    <p th:text="${suggestion.reasonReject}" style="white-space: pre-line;"></p>
                  </div>
                  <div class="mb-3">
                    <label class="form-label fw-bold">Created At: </label>
                    <p th:text="${#temporals.format(suggestion.createdAt, 'dd/MM/yyyy HH:mm')}"></p>
                  </div>
                </div>
                <div class="card-footer">
                  <a th:href="@{/admin/suggestions}">Back to index</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <!--end::App Main-->
    <!--begin::Footer-->
    <th:block th:replace="~{admin/layouts/footer :: footer}"></th:block>
    <!--end::Footer-->
  </div>
  <!--end::App Wrapper-->
  <th:block th:replace="~{admin/layouts/static :: js_scripts}"></th:block>
</body>

</html>
