<!DOCTYPE html>
<!-- Admin email for a new order (AdminMailService.sendOrderPlaced). Variable: order (OrderPlacedSummary) -->
<html xmlns:th="http://www.thymeleaf.org"
  th:replace="~{mail/layout :: mail(|New order #${order.orderId}|, ~{::section})}">

<section>
  <p>
    <strong>Customer:</strong> <span th:text="|${order.customerName} (${order.customerEmail})|"></span><br>
    <strong>Placed at:</strong> <span th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
  </p>

  <table cellpadding="6" cellspacing="0" border="1" style="border-collapse: collapse;">
    <thead>
      <tr>
        <th align="left">Product</th>
        <th align="right">Quantity</th>
        <th align="right">Price</th>
        <th align="right">Amount</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="item : ${order.items}">
        <td th:text="${item.productName}"></td>
        <td align="right" th:text="${item.quantity}"></td>
        <td align="right" th:text="${@money.vnd(item.price)}"></td>
        <td align="right" th:text="${@money.vnd(item.amount)}"></td>
      </tr>
    </tbody>
    <tfoot>
      <tr>
        <th colspan="3" align="right">Total</th>
        <th align="right" th:text="${@money.vnd(order.totalPrice)}"></th>
      </tr>
    </tfoot>
  </table>

  <p>
    <strong>Deliver to:</strong>
    <span th:text="|${order.receiverName} - ${order.phoneNumber} - ${order.address}|"></span>
  </p>
  <p th:if="${order.note != null and !#strings.isEmpty(order.note)}">
    <strong>Note:</strong> <span th:text="${order.note}"></span>
  </p>
</section>

</html>
